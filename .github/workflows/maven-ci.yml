name: Java CI with Maven

# Định nghĩa khi nào con robot GitHub sẽ chạy luồng công việc này
on:
  push:
    branches: [ "main", "master" ] # Chạy khi có người push code lên nhánh main/master
  pull_request:
    branches: [ "main", "master" ] # Chạy khi có người tạo Pull Request vào nhánh main

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Chạy trên máy chủ ảo hệ điều hành Ubuntu mới nhất của GitHub

    steps:
      # Bước 1: Tải mã nguồn của nhóm bạn từ GitHub repo xuống máy chủ ảo
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Java (ở đây dùng Java 17, bạn có thể đổi thành 21 nếu đang dùng bản cao hơn)
      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Giúp tăng tốc độ chạy cho các lần sau bằng cách lưu cache thư viện

      # Bước 3: Chạy lệnh build và test tự động bằng Maven
      # Lệnh này sẽ biên dịch toàn bộ dự án và chạy các file JUnit test của bạn
      - name: Build và Test dự án với Maven
        run: mvn clean test